<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sizzle</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080808;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'DM Sans',sans-serif;padding:20px}
.phone{width:390px;height:844px;background:#0d0d0d;border-radius:50px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #0a0a0a,0 0 0 12px #222,0 50px 100px rgba(0,0,0,.9);display:flex;flex-direction:column}
.sbar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;flex-shrink:0;z-index:10}
.sbar-t{font-size:15px;font-weight:600;color:#fff}
.sbar-i{display:flex;gap:5px;align-items:center;font-size:12px;color:rgba(255,255,255,.7)}
.screen{flex:1;overflow:hidden;position:relative}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;background:#0d0d0d;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.pg.active{display:block;animation:fu .22s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* MODE BADGE */
.mode-badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(255,92,26,.12);border:1px solid rgba(255,92,26,.3);color:#ff5c1a;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 10px;border-radius:10px;cursor:pointer;text-transform:uppercase}
.mode-badge.live{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#22c55e}

/* NAV */
.bnav{height:80px;background:#111;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-around;padding:0 8px 14px;flex-shrink:0;z-index:20}
.ntab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:10px 14px;border-radius:14px;transition:all .2s;flex:1}
.ntab.active{background:rgba(255,92,26,.1)}
.ntab-ic{font-size:22px;transition:transform .2s}
.ntab.active .ntab-ic{transform:scale(1.1)}
.ntab-lb{font-size:10px;font-weight:600;color:rgba(255,255,255,.28);letter-spacing:.5px;text-transform:uppercase}
.ntab.active .ntab-lb{color:#ff5c1a}

/* AUTH */
.auth-pg{position:absolute;inset:0;background:#0d0d0d;z-index:9999;display:flex;flex-direction:column;overflow-y:auto;align-items:center}
.auth-pg.hidden{display:none}
.auth-top{padding:40px 24px 20px;text-align:center;width:100%}
.auth-logo{margin-bottom:20px}
.auth-hero{font-family:Georgia,serif;font-size:24px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:8px}
.auth-sub{font-size:13px;color:rgba(255,255,255,.38);line-height:1.5;margin-bottom:28px}
.auth-tabs{display:flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px;margin:0 24px 20px;width:calc(100% - 48px)}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:rgba(255,255,255,.38);cursor:pointer;transition:all .15s}
.auth-tab.active{background:#ff5c1a;color:#fff}
.auth-form{padding:0 24px;width:100%}
.auth-fg{margin-bottom:13px}
.auth-fl{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:block}
.auth-fi{width:100%;padding:13px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.auth-fi:focus{border-color:#ff5c1a}
.auth-fi::placeholder{color:rgba(255,255,255,.2)}
.auth-btn{width:100%;padding:15px;background:#ff5c1a;color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:#f87171;margin-bottom:12px;display:none}
.auth-err.show{display:block}
.auth-sep{display:flex;align-items:center;gap:12px;margin:16px 24px;font-size:11px;color:rgba(255,255,255,.2);width:calc(100%-48px)}
.auth-sep::before,.auth-sep::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.auth-guest{margin:0 24px 32px;padding:14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;text-align:center;font-size:13px;color:rgba(255,255,255,.4);cursor:pointer;width:calc(100% - 48px)}
.auth-guest b{color:#ff5c1a;font-weight:600}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;position:sticky;top:0;z-index:15;background:linear-gradient(to bottom,#0d0d0d 80%,transparent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.loc-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:6px 11px;font-size:11px;color:rgba(255,255,255,.65);font-weight:500;cursor:pointer}
.av{width:32px;height:32px;background:linear-gradient(135deg,#ff5c1a,#ff8c42);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}

/* HERO */
.hero{position:relative;margin:4px 16px 0;border-radius:22px;overflow:hidden;cursor:pointer;height:300px}
.hero-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;opacity:.55}
.hero-grad{position:absolute;inset:0;background:linear-gradient(170deg,transparent 0%,transparent 30%,rgba(10,10,10,.8) 65%,#0d0d0d 100%)}
.hero-live{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;background:#ff5c1a;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:800;color:#fff;letter-spacing:1.5px;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:lp 1s infinite}
@keyframes lp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.hero-spots-badge{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:5px 10px;text-align:center}
.hero-spots-n{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#ff5c1a;line-height:1}
.hero-spots-l{font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}
.hero-c{position:absolute;bottom:0;left:0;right:0;padding:0 16px 16px}
.hero-tag{font-size:10px;color:#ff5c1a;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px}
.hero-name{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:.95;color:#fff;letter-spacing:.5px;margin-bottom:8px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-disc{background:#ff5c1a;color:#fff;font-size:13px;font-weight:800;padding:6px 14px;border-radius:8px;white-space:nowrap}
.hero-actions{display:flex;gap:8px}
.hero-more{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.hero-claim{background:#fff;color:#0d0d0d;border:none;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:800;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.hero-claim.claimed{background:#22c55e;color:#fff}
.hprog{height:3px;background:rgba(255,255,255,.06);margin:6px 16px 0;border-radius:2px;overflow:hidden}
.hprog-f{height:100%;background:#ff5c1a;border-radius:2px}

/* OFFER TABS */
.offer-tabs{display:flex;gap:8px;padding:16px 16px 10px;overflow-x:auto;scrollbar-width:none}
.offer-tabs::-webkit-scrollbar{display:none}
.otab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);background:transparent}
.otab.active{background:#ff5c1a;border-color:#ff5c1a;color:#fff}
.otab-count{background:rgba(255,255,255,.15);border-radius:10px;padding:1px 6px;font-size:10px}
.otab.active .otab-count{background:rgba(255,255,255,.25)}

/* OFFER CARDS */
.cards{padding:0 16px 100px;display:flex;flex-direction:column;gap:11px}
.oc{border-radius:18px;overflow:hidden;background:#161616;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:transform .18s,border-color .18s;position:relative}
.oc:hover{transform:translateY(-2px);border-color:rgba(255,92,26,.2)}
.oc.crit{border-color:rgba(239,68,68,.3)}
.demo-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);border:1px solid rgba(255,92,26,.4);color:#ff5c1a;font-size:8px;font-weight:800;letter-spacing:1.5px;padding:2px 6px;border-radius:4px;z-index:3}
.oc-img{height:120px;position:relative;display:flex;align-items:center;justify-content:center;font-size:48px}
.oc-img-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(22,22,22,.98) 100%);pointer-events:none}
.oc-rest-lbl{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);border-radius:6px;padding:3px 8px;font-size:9px;color:rgba(255,255,255,.5)}
.oc-badge{position:absolute;bottom:8px;left:8px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px}
.ob-pct{background:#ff5c1a;color:#fff}
.ob-dol{background:#fff;color:#0d0d0d}
.ob-free{background:#22c55e;color:#fff}
.ob-crit{background:#ef4444;color:#fff}
.oc-spots-lbl{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);border-radius:14px;padding:3px 9px;display:flex;align-items:center;gap:3px}
.oc-sn{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#ff5c1a;line-height:1}
.oc-sn.crit{color:#ef4444}
.oc-sl{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase}
.oc-body{padding:11px 13px 13px}
.oc-rest{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;color:#fff;line-height:1}
.oc-sub{font-size:11px;color:rgba(255,255,255,.28);margin-top:2px}
.oc-title{font-size:13px;color:rgba(255,255,255,.6);font-weight:500;margin:6px 0 8px}
.oc-foot{display:flex;align-items:center;gap:10px}
.oc-bar-w{flex:1}
.oc-bar-bg{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.oc-bar-f{height:100%;border-radius:2px;background:#ff5c1a}
.oc-bar-f.low{background:#ef4444}
.oc-bar-t{font-size:9px;color:rgba(255,255,255,.22);margin-top:3px}
.cbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:8px 16px;font-size:11px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.cbtn:hover:not(.claimed){background:#ff5c1a;border-color:#ff5c1a}
.cbtn.claimed{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25);color:#22c55e}

/* ACTIVE CLAIM CARD */
.ac{border-radius:18px;overflow:hidden;background:#161616;border:1px solid rgba(255,92,26,.2);margin-bottom:11px}
.ac-top{display:flex;align-items:stretch}
.ac-img{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.ac-info{flex:1;padding:11px 13px}
.ac-rest{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;letter-spacing:.5px;margin-bottom:2px}
.ac-deal{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:4px}
.ac-row{display:flex;align-items:center;gap:8px}
.ac-live{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(255,92,26,.12);color:#ff5c1a;border:1px solid rgba(255,92,26,.25)}
.ac-ends{font-size:10px;color:rgba(255,255,255,.25)}
.ac-qr-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,92,26,.06);border-top:1px dashed rgba(255,255,255,.07);cursor:pointer;transition:background .15s}
.ac-qr-btn:hover{background:rgba(255,92,26,.12)}
.ac-qr-icon{width:48px;height:48px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#0d0d0d;flex-shrink:0}
.ac-qr-info{flex:1}
.ac-qr-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.ac-qr-sub{font-size:11px;color:rgba(255,255,255,.3)}
.ac-qr-arrow{font-size:22px;color:#ff5c1a;font-weight:700}

/* REDEEMED CARD */
.rc{border-radius:18px;overflow:hidden;background:#161616;border:1px solid rgba(34,197,94,.15);cursor:pointer;margin-bottom:11px}
.rc-top{display:flex;align-items:stretch}
.rc-img{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.rc-info{flex:1;padding:11px 13px}
.rc-rest{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;letter-spacing:.5px;margin-bottom:2px}
.rc-deal{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:4px}
.rc-date{font-size:10px;color:rgba(255,255,255,.22)}
.rc-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2)}

/* SHEET */
.sheet{position:absolute;inset:0;z-index:200;display:none;flex-direction:column}
.sheet.open{display:flex;animation:su .28s cubic-bezier(.32,.72,0,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.sheet-p{position:absolute;bottom:0;left:0;right:0;background:#111;border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet-p::-webkit-scrollbar{display:none}
.sheet-hero{height:190px;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:26px 26px 0 0;overflow:hidden;position:relative}
.sheet-hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(17,17,17,.95) 100%)}
.sheet-x{position:absolute;top:14px;right:14px;width:30px;height:30px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.7);cursor:pointer;z-index:5}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.13);border-radius:2px;margin:12px auto 0}
.sheet-body{padding:16px 20px 32px}
.sheet-rest-name{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:.5px;margin-bottom:2px}
.sheet-rest-sub{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:16px}
.sheet-offer-box{background:rgba(255,92,26,.0
